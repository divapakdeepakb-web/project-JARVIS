
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECT JARVIS</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(circle,#10365b,#020812 72%);
  color:#66e5ff;font-family:Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px
}
main{width:100%;max-width:440px}
h1{letter-spacing:5px;text-shadow:0 0 15px #00bfff}
.reactor{
  width:190px;height:190px;border-radius:50%;
  border:3px solid #48dfff;margin:30px auto;
  display:grid;place-items:center;
  box-shadow:0 0 20px #00bfff,inset 0 0 25px #008cff;
  animation:pulse 2s infinite alternate
}
.core{width:95px;height:95px;border:5px double #8af4ff;
border-radius:50%;box-shadow:0 0 25px #00bfff}
button,input{
  padding:13px;border:1px solid #36cfff;
  background:#06192a;color:#8aeaff;border-radius:8px;
  margin:5px;font-size:15px
}
input{width:68%}
#reply{min-height:40px}
@keyframes pulse{
  to{box-shadow:0 0 38px #00bfff,inset 0 0 40px #008cff}
}
</style>
</head>
<body>
<main>
<h1>PROJECT JARVIS</h1>
<p>PERSONAL AI INTERFACE</p>
<div class="reactor"><div class="core"></div></div>
<p id="status">SYSTEM ONLINE · INTERFACE READY</p>
<form id="chat">
<input id="message" placeholder="Ask JARVIS..." required>
<button>Send</button>
</form>
<p id="reply">Awaiting your command.</p>
<button id="voice">🎙 Voice Input</button>
</main>
<script>
const reply=document.getElementById('reply');
document.getElementById('chat').onsubmit=e=>{
 e.preventDefault();
 const q=document.getElementById('message').value.trim();
 reply.textContent='Interface received: '+q+
 '. Connect an AI service to enable intelligent answers.';
};
document.getElementById('voice').onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){reply.textContent='Voice recognition is not supported here.';return;}
 const r=new SR();r.lang='en-IN';
 r.onresult=e=>{
 document.getElementById('message').value=e.results[0][0].transcript;
 };
 r.start();
};
</script>
</body>
</html>
